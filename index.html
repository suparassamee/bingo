<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>124 YEARS OF EXCELLENCE - Bingo Board</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', 'Arial Bold', Gadget, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        /* ส่วนหัวข้อความและโลโก้ */
        .header-title-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 25px;
            line-height: 0.9;
        }

        /* โลโก้ Carrier ด้านบนสุด */
        .logo {
            width: 220px;
            max-width: 90vw;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.15));
        }

        /* เลข 124 สีน้ำเงินเข้ม */
        .title-124 {
            font-size: 85px;
            font-weight: 900;
            color: #1a2b6d;
            letter-spacing: -2px;
            margin: 0;
        }

        /* คำว่า YEARS OF สีฟ้าสดใส */
        .title-years {
            font-size: 42px;
            font-weight: 900;
            color: #007cc3;
            letter-spacing: 1px;
            margin: 4px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .title-years .of-text {
            font-size: 14px;
            font-weight: 800;
            color: #1a2b6d;
            display: inline-block;
            line-height: 1;
            text-align: center;
        }

        /* คำว่า EXCELLENCE สีน้ำเงินเข้ม */
        .title-excellence {
            font-size: 38px;
            font-weight: 900;
            color: #1a2b6d;
            letter-spacing: 1.5px;
            margin: 0;
        }

        .controls {
            margin-bottom: 20px;
        }

        button {
            padding: 10px 24px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #1a2b6d;
            color: white;
            border: none;
            border-radius: 25px;
            box-shadow: 0 4px 6px rgba(26, 43, 109, 0.2);
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #0d1842;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(26, 43, 109, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        /* ตารางบิงโก */
        .bingo-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            border: 3px solid #1a2b6d;
            border-radius: 12px;
            overflow: hidden;
            background-color: #ffffff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .column {
            display: flex;
            flex-direction: column;
        }

        .cell {
            width: 75px;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #dcdcdc;
            font-size: 20px;
            font-weight: bold;
            user-select: none;
        }

        /* หัวตาราง B I N G O */
        .header {
            background-color: #1a2b6d;
            color: #ffffff;
            font-size: 26px;
            font-weight: 800;
            border: none;
            border-bottom: 2px solid #1a2b6d;
        }

        /* ตัวเลขปกติ */
        .number {
            color: #333333;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .number:hover {
            background-color: #e6f0fa;
        }

        /* ตัวเลขที่ถูกคลิกเลือกแล้ว */
        .number.selected {
            background-color: #007cc3;
            color: #ffffff;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <!-- ส่วนหัวที่มีทั้ง โลโก้ และ ข้อความ 124 YEARS OF EXCELLENCE -->
    <div class="header-title-container">
        <!-- อ้างอิงไฟล์รูป carrier2.png -->
        <img src="carrier2.png" alt="Carrier Logo" class="logo">

        <div class="title-124">124</div>
        <div class="title-years">
            YEARS 
            <span class="of-text">OF</span>
        </div>
        <div class="title-excellence">EXCELLENCE</div>
    </div>

    <div class="controls">
        <button onclick="resetBoard()">ล้างกระดาน (Reset)</button>
    </div>

    <div class="bingo-board" id="board"></div>

    <script>
        const columns = [
            { letter: 'B', min: 1, max: 15 },
            { letter: 'I', min: 16, max: 30 },
            { letter: 'N', min: 31, max: 45 },
            { letter: 'G', min: 46, max: 60 },
            { letter: 'O', min: 61, max: 75 }
        ];

        function createBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';

            columns.forEach(col => {
                const columnDiv = document.createElement('div');
                columnDiv.className = 'column';

                // หัวแถว B I N G O
                const headerDiv = document.createElement('div');
                headerDiv.className = 'cell header';
                headerDiv.innerText = col.letter;
                columnDiv.appendChild(headerDiv);

                // ช่องตัวเลข 15 ตัวในแต่ละคอลัมน์
                for (let num = col.min; num <= col.max; num++) {
                    const cellDiv = document.createElement('div');
                    cellDiv.className = 'cell number';
                    cellDiv.innerText = num;
                    cellDiv.onclick = function() {
                        this.classList.toggle('selected');
                    };
                    columnDiv.appendChild(cellDiv);
                }

                board.appendChild(columnDiv);
            });
        }

        function resetBoard() {
            if (confirm('ต้องการล้างกระดานใช่หรือไม่?')) {
                const selectedCells = document.querySelectorAll('.cell.selected');
                selectedCells.forEach(cell => cell.classList.remove('selected'));
            }
        }

        // เริ่มต้นสร้างกระดานเมื่อเปิดหน้าเว็บ
        createBoard();
    </script>

</body>
</html>
