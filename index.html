<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>124 YEARS OF EXCELLENCE - Bingo Board</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', 'Arial Bold', Gadget, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        /* ส่วนหัวข้อความและโลโก้ */
        .header-title-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 25px;
            line-height: 0.9;
        }

        /* โลโก้ Carrier ด้านบนสุด */
        .logo {
            width: 220px;
            max-width: 90vw;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.15));
        }

        /* เลข 124 สีน้ำเงินเข้ม */
        .title-124 {
            font-size: 85px;
            font-weight: 900;
            color: #1a2b6d;
            letter-spacing: -2px;
            margin: 0;
        }

        /* คำว่า YEARS OF สีฟ้าสดใส */
        .title-years {
            font-size: 42px;
            font-weight: 900;
            color: #007cc3;
            letter-spacing: 1px;
            margin: 4px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .title-years .of-text {
            font-size: 14px;
            font-weight: 800;
            color: #1a2b6d;
            display: inline-block;
            line-height: 1;
            text-align: center;
        }

        /* คำว่า EXCELLENCE สีน้ำเงินเข้ม */
        .title-excellence {
            font-size: 38px;
            font-weight: 900;
            color: #1a2b6d;
            letter-spacing: 1.5px;
            margin: 0;
        }

        .controls {
            margin-bottom: 20px;
        }

        button {
            padding: 10px 24px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #1a2b6d;
            color: white;
            border: none;
            border-radius: 25px;
            box-shadow: 0 4px 6px rgba(26, 43, 109, 0.2);
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #0d1842;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(26, 43, 109, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background-color: #a0a0a0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* เลย์เอาต์หลัก แบ่งฝั่งวงล้อกับตาราง */
        .main-container {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        /* ส่วนของวงล้อ */
        .wheel-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border: 3px solid #1a2b6d;
        }

        .wheel-wrapper {
            position: relative;
            width: 380px;
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ลูกศรชี้วงล้อ */
        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #d9534f;
            z-index: 10;
        }

        #wheelCanvas {
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        .spin-btn {
            margin-top: 15px;
            background-color: #007cc3;
            font-size: 18px;
            padding: 12px 30px;
        }

        .spin-btn:hover {
            background-color: #005a8f;
        }

        .result-display {
            margin-top: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #1a2b6d;
            height: 32px;
        }

        /* ตารางบิงโก */
        .bingo-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            border: 3px solid #1a2b6d;
            border-radius: 12px;
            overflow: hidden;
            background-color: #ffffff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .column {
            display: flex;
            flex-direction: column;
        }

        .cell {
            width: 75px;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #dcdcdc;
            font-size: 20px;
            font-weight: bold;
            user-select: none;
        }

        /* หัวตาราง B I N G O */
        .header {
            background-color: #1a2b6d;
            color: #ffffff;
            font-size: 26px;
            font-weight: 800;
            border: none;
            border-bottom: 2px solid #1a2b6d;
        }

        /* ตัวเลขปกติ */
        .number {
            color: #333333;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .number:hover {
            background-color: #e6f0fa;
        }

        /* ตัวเลขที่ถูกเลือก */
        .number.selected {
            background-color: #007cc3;
            color: #ffffff;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <!-- ส่วนหัวที่มีทั้ง โลโก้ และ ข้อความ 124 YEARS OF EXCELLENCE -->
    <div class="header-title-container">
        <img src="carrier2.png" alt="Carrier Logo" class="logo">
        <div class="title-124">124</div>
        <div class="title-years">
            YEARS 
            <span class="of-text">OF</span>
        </div>
        <div class="title-excellence">EXCELLENCE</div>
    </div>

    <div class="controls">
        <button onclick="resetBoard()">ล้างกระดาน (Reset)</button>
    </div>

    <!-- คอนเทนเนอร์หลัก แบ่งฝั่งวงล้อกับตาราง -->
    <div class="main-container">
        
        <!-- ฝั่งซ้าย: วงล้อสุ่มเลข -->
        <div class="wheel-container">
            <div class="wheel-wrapper">
                <div class="pointer"></div>
                <canvas id="wheelCanvas" width="380" height="380"></canvas>
            </div>
            <button class="spin-btn" id="spinBtn" onclick="spinWheel()">หมุนวงล้อสุ่มเลข</button>
            <div class="result-display" id="resultDisplay">กดหมุนเพื่อเริ่มสุ่ม</div>
        </div>

        <!-- ฝั่งขวา: ตารางบิงโก -->
        <div class="bingo-board" id="board"></div>

    </div>

    <script>
        const columns = [
            { letter: 'B', min: 1, max: 15 },
            { letter: 'I', min: 16, max: 30 },
            { letter: 'N', min: 31, max: 45 },
            { letter: 'G', min: 46, max: 60 },
            { letter: 'O', min: 61, max: 75 }
        ];

        // ตัวแปรสำหรับวงล้อและการสุ่ม
        let availableNumbers = Array.from({length: 75}, (_, i) => i + 1);
        let isSpinning = false;
        let currentRotation = 0;
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const totalSegments = 75;

        // วาดรูปวงล้อ 75 ช่องพร้อมตัวเลข
        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;
            const sliceAngle = (2 * Math.PI) / totalSegments;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < totalSegments; i++) {
                const angle = i * sliceAngle;
                const num = i + 1;

                // วาดช่องวงล้อ
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius - 2, angle, angle + sliceAngle);
                ctx.closePath();

                // สลับสีฟ้า/น้ำเงินตามธีม
                ctx.fillStyle = (i % 2 === 0) ? '#1a2b6d' : '#007cc3';
                ctx.fill();
                ctx.lineWidth = 0.5;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // วาดตัวเลขลงในช่อง
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 9px Arial";
                ctx.fillText(num, radius - 6, 3);
                ctx.restore();
            }

            // วาดวงกลมตรงกลางวงล้อ
            ctx.beginPath();
            ctx.arc(centerX, centerY, 25, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#1a2b6d';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        // ฟังก์ชันหมุนวงล้อ
        function spinWheel() {
            if (isSpinning) return;
            if (availableNumbers.length === 0) {
                alert('สุ่มครบทั้ง 75 เลขแล้ว!');
                return;
            }

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('resultDisplay').innerText = "กำลังสุ่ม...";

            // สุ่มเลือกเลขจากรายการที่เหลืออยู่
            const randomIndex = Math.floor(Math.random() * availableNumbers.length);
            const selectedNumber = availableNumbers[randomIndex];
            
            // ลบเลขที่ถูกสุ่มออก เพื่อไม่ให้สุ่มซ้ำ
            availableNumbers.splice(randomIndex, 1);

            // คำนวณองศาการหมุนให้อยู่ตรงลูกศรด้านบนพอดี (-90 องศาคือทิศด้านบน)
            const extraRounds = 5 + Math.floor(Math.random() * 3); // หมุน 5-7 รอบ
            const sliceDeg = 360 / totalSegments;
            
            // ตำแหน่งมุมของเลขที่ถูกสุ่ม
            const numberAngle = (selectedNumber - 1) * sliceDeg + (sliceDeg / 2);
            
            // หมุนให้ตำแหน่งเป้าหมายไปหยุดที่ด้านบนสุด (270 องศา)
            const targetRotation = (270 - numberAngle) % 360;
            const currentDegree = currentRotation % 360;
            let degreeToRotate = targetRotation - currentDegree;
            
            if (degreeToRotate <= 0) {
                degreeToRotate += 360;
            }

            const totalDegrees = currentRotation + (extraRounds * 360) + degreeToRotate;

            currentRotation = totalDegrees;
            canvas.style.transition = 'transform 4s cubic-bezier(0.15, 0.9, 0.2, 1)';
            canvas.style.transform = `rotate(${totalDegrees}deg)`;

            // เมื่อวงล้อหมุนเสร็จสิ้น (4 วินาที)
            setTimeout(() => {
                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;
                
                // หาตัวอักษรประจำหมวด B-I-N-G-O
                let letter = '';
                if (selectedNumber <= 15) letter = 'B';
                else if (selectedNumber <= 30) letter = 'I';
                else if (selectedNumber <= 45) letter = 'N';
                else if (selectedNumber <= 60) letter = 'G';
                else letter = 'O';

                document.getElementById('resultDisplay').innerText = `ออกเลข: ${letter}-${selectedNumber}`;

                // ไฮไลท์เลขบนตารางอัตโนมัติ
                const targetCell = document.querySelector(`.cell.number[data-num="${selectedNumber}"]`);
                if (targetCell) {
                    targetCell.classList.add('selected');
                }
            }, 4000);
        }

        // สร้างตารางบิงโก
        function createBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';

            columns.forEach(col => {
                const columnDiv = document.createElement('div');
                columnDiv.className = 'column';

                // หัวแถว B I N G O
                const headerDiv = document.createElement('div');
                headerDiv.className = 'cell header';
                headerDiv.innerText = col.letter;
                columnDiv.appendChild(headerDiv);

                // ช่องตัวเลข 15 ตัวในแต่ละคอลัมน์
                for (let num = col.min; num <= col.max; num++) {
                    const cellDiv = document.createElement('div');
                    cellDiv.className = 'cell number';
                    cellDiv.innerText = num;
                    cellDiv.setAttribute('data-num', num);
                    
                    // ยังคงรองรับการคลิกเองได้ตามปกติ
                    cellDiv.onclick = function() {
                        this.classList.toggle('selected');
                    };
                    columnDiv.appendChild(cellDiv);
                }

                board.appendChild(columnDiv);
            });
        }

        // รีเซ็ทกระดานและระบบสุ่ม
        function resetBoard() {
            if (confirm('ต้องการล้างกระดานและเริ่มสุ่มใหม่ใช่หรือไม่?')) {
                const selectedCells = document.querySelectorAll('.cell.selected');
                selectedCells.forEach(cell => cell.classList.remove('selected'));
                
                // รีเซ็ทรายการสุ่มเลข
                availableNumbers = Array.from({length: 75}, (_, i) => i + 1);
                document.getElementById('resultDisplay').innerText = "กดหมุนเพื่อเริ่มสุ่ม";
                
                // คืนค่าตำแหน่งหมุนวงล้อ
                canvas.style.transition = 'none';
                canvas.style.transform = 'rotate(0deg)';
                currentRotation = 0;
            }
        }

        // เริ่มต้นการทำงานเมื่อเปิดหน้าเว็บ
        drawWheel();
        createBoard();
    </script>

</body>
</html>
