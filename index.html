<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>124 YEARS OF EXCELLENCE - Bingo Board</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', 'Arial Bold', Gadget, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* คอนเทนเนอร์หลัก จัดสองฝั่งซ้าย-ขวา */
        .main-container {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            justify-content: center;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
        }

        /* --- ฝั่งซ้าย: โลโก้ + วงล้อ --- */
        .left-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border: 3px solid #1a2b6d;
            flex: 1;
            max-width: 420px;
        }

        /* โลโก้และข้อความฝั่งซ้าย */
        .header-title-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            line-height: 0.85;
            margin-bottom: 10px;
        }

        .logo {
            width: 170px;
            max-width: 100%;
            height: auto;
            margin-bottom: 8px;
            filter: drop-shadow(0px 3px 4px rgba(0, 0, 0, 0.15));
        }

        .title-124 {
            font-size: 55px;
            font-weight: 900;
            color: #1a2b6d;
            letter-spacing: -2px;
            margin: 0;
        }

        .title-years {
            font-size: 28px;
            font-weight: 900;
            color: #007cc3;
            letter-spacing: 1px;
            margin: 2px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .title-years .of-text {
            font-size: 11px;
            font-weight: 800;
            color: #1a2b6d;
            display: inline-block;
            line-height: 1;
        }

        .title-excellence {
            font-size: 25px;
            font-weight: 900;
            color: #1a2b6d;
            letter-spacing: 1px;
            margin: 0;
        }

        /* วงล้อ */
        .wheel-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
        }

        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 20px solid #d9534f;
            z-index: 10;
        }

        #wheelCanvas {
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0,0,0,0.2);
        }

        .wheel-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .spin-btn {
            background-color: #007cc3;
            font-size: 16px;
            padding: 10px 24px;
            width: 100%;
            max-width: 250px;
        }

        .spin-btn:hover {
            background-color: #005a8f;
        }

        .result-display {
            margin-top: 8px;
            font-size: 20px;
            font-weight: bold;
            color: #1a2b6d;
            height: 26px;
            text-align: center;
        }

        /* --- ฝั่งขวา: ปุ่มรีเซ็ต + ตารางบิงโก --- */
        .right-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            flex: 1;
        }

        .controls {
            margin-bottom: 12px;
            width: 100%;
            display: flex;
            justify-content: flex-end;
        }

        button {
            padding: 10px 20px;
            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background-color: #1a2b6d;
            color: white;
            border: none;
            border-radius: 25px;
            box-shadow: 0 4px 6px rgba(26, 43, 109, 0.2);
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #0d1842;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(26, 43, 109, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background-color: #a0a0a0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ตารางบิงโก */
        .bingo-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            border: 3px solid #1a2b6d;
            border-radius: 12px;
            overflow: hidden;
            background-color: #ffffff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            width: 100%;
            height: 100%;
        }

        .column {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .cell {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #dcdcdc;
            font-size: 18px;
            font-weight: bold;
            user-select: none;
            min-height: 38px;
        }

        .header {
            background-color: #1a2b6d;
            color: #ffffff;
            font-size: 24px;
            font-weight: 800;
            border: none;
            border-bottom: 2px solid #1a2b6d;
            flex: 0 0 48px;
        }

        .number {
            color: #333333;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .number:hover {
            background-color: #e6f0fa;
        }

        .number.selected {
            background-color: #007cc3;
            color: #ffffff;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="left-panel">
            <div class="header-title-container">
                <img src="carrier2.png" alt="Carrier Logo" class="logo">
                <div class="title-124">124</div>
                <div class="title-years">
                    YEARS 
                    <span class="of-text">OF</span>
                </div>
                <div class="title-excellence">EXCELLENCE</div>
            </div>

            <div class="wheel-wrapper">
                <div class="pointer"></div>
                <canvas id="wheelCanvas" width="300" height="300"></canvas>
            </div>

            <div class="wheel-controls">
                <button class="spin-btn" id="spinBtn" onclick="spinWheel()">หมุนวงล้อสุ่มเลข</button>
                <div class="result-display" id="resultDisplay">กดหมุนเพื่อเริ่มสุ่ม</div>
            </div>
        </div>

        <div class="right-panel">
            <div class="controls">
                <button onclick="resetBoard()">ล้างกระดาน (Reset)</button>
            </div>
            <div class="bingo-board" id="board"></div>
        </div>

    </div>

    <script>
        const columns = [
            { letter: 'B', min: 1, max: 15 },
            { letter: 'I', min: 16, max: 30 },
            { letter: 'N', min: 31, max: 45 },
            { letter: 'G', min: 46, max: 60 },
            { letter: 'O', min: 61, max: 75 }
        ];

        let availableNumbers = Array.from({length: 75}, (_, i) => i + 1);
        let isSpinning = false;
        let currentRotation = 0;
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const totalSegments = 75;

        // วาดรูปวงล้อพร้อมเลข
        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;
            const sliceAngle = (2 * Math.PI) / totalSegments;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < totalSegments; i++) {
                const angle = i * sliceAngle;
                const num = i + 1;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius - 2, angle, angle + sliceAngle);
                ctx.closePath();

                ctx.fillStyle = (i % 2 === 0) ? '#1a2b6d' : '#007cc3';
                ctx.fill();
                ctx.lineWidth = 0.5;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 8px Arial";
                ctx.fillText(num, radius - 4, 3);
                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(centerX, centerY, 20, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#1a2b6d';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        // หมุนวงล้อ
        function spinWheel() {
            if (isSpinning) return;
            if (availableNumbers.length === 0) {
                alert('สุ่มครบทั้ง 75 เลขแล้ว!');
                return;
            }

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('resultDisplay').innerText = "กำลังสุ่ม...";

            const randomIndex = Math.floor(Math.random() * availableNumbers.length);
            const selectedNumber = availableNumbers[randomIndex];
            
            availableNumbers.splice(randomIndex, 1);

            const extraRounds = 5 + Math.floor(Math.random() * 3);
            const sliceDeg = 360 / totalSegments;
            
            const numberAngle = (selectedNumber - 1) * sliceDeg + (sliceDeg / 2);
            const targetRotation = (270 - numberAngle) % 360;
            const currentDegree = currentRotation % 360;
            let degreeToRotate = targetRotation - currentDegree;
            
            if (degreeToRotate <= 0) {
                degreeToRotate += 360;
            }

            const totalDegrees = currentRotation + (extraRounds * 360) + degreeToRotate;

            currentRotation = totalDegrees;
            canvas.style.transition = 'transform 4s cubic-bezier(0.15, 0.9, 0.2, 1)';
            canvas.style.transform = `rotate(${totalDegrees}deg)`;

            setTimeout(() => {
                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;
                
                let letter = '';
                if (selectedNumber <= 15) letter = 'B';
                else if (selectedNumber <= 30) letter = 'I';
                else if (selectedNumber <= 45) letter = 'N';
                else if (selectedNumber <= 60) letter = 'G';
                else letter = 'O';

                document.getElementById('resultDisplay').innerText = `ออกเลข: ${letter}-${selectedNumber}`;

                const targetCell = document.querySelector(`.cell.number[data-num="${selectedNumber}"]`);
                if (targetCell) {
                    targetCell.classList.add('selected');
                }
            }, 4000);
        }

        // สร้างตารางบิงโก
        function createBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';

            columns.forEach(col => {
                const columnDiv = document.createElement('div');
                columnDiv.className = 'column';

                const headerDiv = document.createElement('div');
                headerDiv.className = 'cell header';
                headerDiv.innerText = col.letter;
                columnDiv.appendChild(headerDiv);

                for (let num = col.min; num <= col.max; num++) {
                    const cellDiv = document.createElement('div');
                    cellDiv.className = 'cell number';
                    cellDiv.innerText = num;
                    cellDiv.setAttribute('data-num', num);
                    
                    cellDiv.onclick = function() {
                        this.classList.toggle('selected');
                    };
                    columnDiv.appendChild(cellDiv);
                }

                board.appendChild(columnDiv);
            });
        }

        // รีเซ็ทระบบ
        function resetBoard() {
            if (confirm('ต้องการล้างกระดานและเริ่มสุ่มใหม่ใช่หรือไม่?')) {
                const selectedCells = document.querySelectorAll('.cell.selected');
                selectedCells.forEach(cell => cell.classList.remove('selected'));
                
                availableNumbers = Array.from({length: 75}, (_, i) => i + 1);
                document.getElementById('resultDisplay').innerText = "กดหมุนเพื่อเริ่มสุ่ม";
                
                canvas.style.transition = 'none';
                canvas.style.transform = 'rotate(0deg)';
                currentRotation = 0;
            }
        }

        drawWheel();
        createBoard();
    </script>

</body>
</html>
